services:
  - type: web
    name: wizardview
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app -c gunicorn_config.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: LINEAR_API_KEY
        sync: false
      - key: LINEAR_TEAM_ID
        value: ENG
      - key: WIZARDVIEW_URL
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false

